sonar.projectKey=taskflow-api
sonar.projectName=TaskFlow API
sonar.sourceEncoding=UTF-8

# What to analyse
sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/node_modules/**,coverage/**,reports/**

# Coverage + external linter results feed the quality gate
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.eslint.reportPaths=reports/eslint/eslint-report.json

# Exclusions (justified): server.js is only process bootstrap (listen/shutdown) and is exercised by the E2E stage
sonar.coverage.exclusions=src/server.js
# Test files legitimately repeat setup code
sonar.cpd.exclusions=tests/**
