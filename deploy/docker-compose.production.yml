# Production environment - promoted automatically by the Release stage.
name: taskflow-production
services:
  api:
    image: ${REGISTRY:-localhost:5050}/taskflow-api:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: taskflow-production
    env_file: production.env
    environment:
      APP_VERSION: ${IMAGE_TAG}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CHAOS_TOKEN: ${CHAOS_TOKEN:?CHAOS_TOKEN is required}
    ports:
      - "3000:3000"
    restart: always
    mem_limit: 256m
    cpus: 1.0
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    labels:
      com.taskflow.environment: production
    networks: [devops-net]

networks:
  devops-net:
    external: true
